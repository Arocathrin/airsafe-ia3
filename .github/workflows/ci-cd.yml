name: AirSafe CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  PROJECT_ID: airsafe-ia3-48213
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest requests python-dotenv
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Build app Docker image (validates the Dockerfile)
        run: docker build -t airsafe-app:ci app/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy pipeline Cloud Function
        run: >
          gcloud functions deploy airsafe-pipeline --gen2 --runtime=python312
          --region=$REGION --source=pipeline --entry-point=pipeline
          --trigger-http --no-allow-unauthenticated --memory=512Mi --timeout=540s
          --project=$PROJECT_ID
      - name: Deploy Streamlit app to Cloud Run
        run: >
          gcloud run deploy airsafe-app --source app --region=$REGION
          --allow-unauthenticated --memory=512Mi --min-instances=0 --max-instances=2
          --project=$PROJECT_ID